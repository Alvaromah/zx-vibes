name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs against an arbitrary ref. NOTE: dispatching this does NOT unblock
  # the Changesets "Version Packages" PR — a workflow_dispatch run attaches its
  # check runs to the COMMIT but not to the pull request, so the PR's
  # statusCheckRollup stays empty and branch protection still sees nothing.
  # Measured on PR #33: six green contexts on the head SHA, rollup NULL, BLOCKED.
  # See the release runbook below for what actually works.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:drift
      - run: pnpm run conformance:check
      - run: pnpm run build
      - run: git diff --exit-code
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test

  # A PR that changes a published package without declaring a bump releases
  # nothing: with no changeset, `changeset version` is a no-op, so the work sits
  # on main unpublished (exactly what happened to PR #29). Catch it at review
  # time rather than at release time.
  #
  # Not in the required-contexts list yet — add "changeset" to branch protection
  # once you are happy with its signal.
  #
  # Skipped on changeset-release/**: that PR is the release itself. It CONSUMES
  # the changesets and writes the version bump, so `changeset status --since`
  # correctly reports "packages changed, no changesets" — a guaranteed false
  # positive on every single release (observed on PR #33).
  #
  # RELEASE RUNBOOK — the "Version Packages" PR opens with no checks at all,
  # because changesets/action creates it with the repo GITHUB_TOKEN and GitHub
  # will not run workflows for that token's events. Its pull_request run is
  # created but parked at `action_required`. To release:
  #
  #   gh api -X POST repos/<owner>/<repo>/actions/runs/<run_id>/approve
  #
  # That starts the parked run; its checks attach to the PR properly and the
  # required contexts go green. Do NOT use workflow_dispatch for this (see the
  # note on the trigger above) and do NOT merge with --admin, which would skip
  # validating the package.json/README/starter manifests the bump rewrites.
  #
  # The permanent fix is giving changesets/action a PAT instead of GITHUB_TOKEN.
  changeset:
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status --since needs real history to diff against the base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every changed published package declares a version bump
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          pnpm exec changeset status --since=origin/${{ github.base_ref }}
