packages:
  - "packages/*"
  - "examples/*"

# Dependency settings live here (not in package.json#pnpm) so pnpm 10+ does not
# warn about the deprecated manifest field.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true

# Transitive dependencies pinned to their first patched release. Each pin below
# satisfies the range its consumer declares, so nothing is forced across a major
# boundary. Keep this list in step with the Dependabot alerts: a bump in a root
# manifest alone does not move a package that is pinned here.
overrides:
  brace-expansion@1: "1.1.21" # via minimatch@3 (^1.1.7) <- eslint
  esbuild: "0.28.1"
  fast-uri: "3.1.9" # via ajv (^3.0.1) <- @modelcontextprotocol/sdk
  form-data: "4.0.6"
  js-yaml: "4.3.2" # via read-yaml-file (^4.0.0) <- @changesets/cli
  read-yaml-file: "2.1.0"
  vite: "8.1.7" # via vitest (^6 || ^7 || ^8) and @vitest/mocker
# Not pinned: minimatch@10 (via @typescript-eslint/typescript-estree ^10.2.2, dev-only
# lint). Its fix ships only in minimatch 11, across the major boundary above.
